services:

  frontend:
    build:
      context: ./spa
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./spa/docker:/usr/src/app/docker
      - ./spa/public:/usr/src/app/public
      - ./spa/src:/usr/src/app/src
      - ./spa/vite.config.ts:/usr/src/app/vite.config.ts
      - ./spa/.env:/usr/src/app/.env
    networks:
      - sail
    environment:
      VITE_BASE_URL: http://localhost:8000
      NODE_ENV: development
    command: bash /usr/src/app/docker/entrypoint.sh
    image: react-spa

  laravel:
    container_name: 'laravel'
    build:
      context: ./api
      dockerfile: Dockerfile
    working_dir: /var/www/html
    ports:
      - 8001:80
      - 5173:5173
    volumes:
      - './api/app:/var/www/html/app'
      - './api/bootstrap:/var/www/html/bootstrap'
      - './api/config:/var/www/html/config'
      - './api/database:/var/www/html/database'
      - './api/public:/var/www/html/public'
      - './api/resources:/var/www/html/resources'
      - './api/routes:/var/www/html/routes'
      - './api/storage:/var/www/html/storage'
      - './api/tests:/var/www/html/tests'
    depends_on:
      - db
    networks:
      - sail

  nginx:
    image: nginx:latest
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./api/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./api:/var/www/html
    depends_on:
      - laravel
    networks:
      - sail

  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - db:/var/lib/postgresql/data
      - ./api/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - sail

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: user@localhost.com
      PGADMIN_DEFAULT_PASSWORD: password
    networks:
      - sail
    depends_on:
      - db

networks:
  sail:
    driver: bridge

volumes:
  db:
    driver: local
